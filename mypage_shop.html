<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주문내역</title>
    <style>
        /* ===================== 폰트 ===================== */
@font-face {
    font-family: 'Pretendard4';
    src: url('https://cdn.jsdelivr.net/gh/Project-Noonnu/noonfonts_2107@1.1/Pretendard-Regular.woff') format('woff');
    font-weight: 400;
    font-display: swap;
}
@font-face {
    font-family: 'Pretendard5';
    src: url('https://cdn.jsdelivr.net/gh/Project-Noonnu/noonfonts_2107@1.1/Pretendard-Medium.woff') format('woff');
    font-weight: 500;
    font-display: swap;
}
@font-face {
    font-family: 'Pretendard6';
    src: url('https://cdn.jsdelivr.net/gh/Project-Noonnu/noonfonts_2107@1.1/Pretendard-SemiBold.woff') format('woff');
    font-weight: 600;
    font-display: swap;
}
@font-face {
    font-family: 'Pretendard7';
    src: url('https://cdn.jsdelivr.net/gh/Project-Noonnu/noonfonts_2107@1.1/Pretendard-Bold.woff') format('woff');
    font-weight: 700;
    font-display: swap;
}

/* ===================== 초기화 ===================== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Pretendard4', sans-serif;
    background: url('bluestar.jpg');
    background-attachment: fixed;
    position: relative;
    min-height: 100vh;
}

/* ===================== 컨테이너 ===================== */
.container {
    max-width: 1230px;
    margin: 0 auto;
    padding: 0;
    background: #E7F5FE;
    border: 3px solid #66B2FF;
    border-radius: 20px;
    position: relative;
    overflow: hidden;
    min-height: 80vh;
}

/* ===================== 헤더 ===================== */
#header {
    width: 100%;
    padding: 12px 0;
    position: relative;
}

#snb {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    padding-top: 9px;
    padding-right: 350px;
}

#snb ul {
    list-style: none;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    padding: 0;
    margin: 0;
}

#snb img {
    width: 30px;
    height: 30px;
}

.header {
    padding: 20px 0;
    text-align: center;
    margin-bottom: 20px;
}

.header h1 {
    font-size: 24px;
    font-weight: 700;
    color: #004080;
    text-align: center;
    margin-bottom: 20px;
    padding: 15px;
    background: #E0F7FF;
    border: 2px solid #3399FF;
    border-radius: 20px;
    position: relative;
}

.header h1::before { 
    content:'☆'; 
    position:absolute; 
    left:20px; 
    color:#3399FF;
}

.header h1::after { 
    content:'☆'; 
    position:absolute; 
    right:20px; 
    color:#3399FF;
}

/* ===================== 메인 레이아웃 ===================== */
.main-layout {
    display: flex;
    gap: 25px;
    align-items: flex-start;
    padding: 20px;
}

/* ===================== 사이드바 ===================== */
.sidebar {
    width: 280px;
}

/* 프로필 카드 */
.profile-card {
    background: #c1e7ffad;
    border: 2px solid #3399FF;
    border-radius: 15px;
    padding: 25px 25px 10px 25px;
    text-align: center;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
}

.profile-card::before {
    content: '✧･ﾟ: *✧･ﾟ:* ♡ *:･ﾟ✧*:･ﾟ✧';
    position: absolute;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    color: #3399FF;
    font-size: 10px;
}

.profile-pic img {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    border: 3px solid #3399FF;
    box-shadow: 0 0 0 2px #FFF, 0 0 15px rgba(51,153,255,0.4);
}

.profile-name {
    font-weight: 700;
    font-size: 18px;
    color: #004080;
    margin-bottom: 8px;
}

/* 네비게이션 */
.navigation {
    background: #c1e7ffad;
    border: 2px solid #3399FF;
    border-radius: 15px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    width: 280px;
}

.navigation a {
    text-decoration: none;
    color: inherit;
    display: block;
}

.nav-item {
    padding: 12px 16px;
    border-radius: 20px;
    font-weight: 500;
    color: #004080;
    text-align: center;
    background: #E0F7FF;
    border: 2px solid #3399FF;
    transition: all 0.3s ease;
    margin-bottom: 8px;
    cursor: pointer;
}

.nav-item:hover {
    background: #66B2FF;
}

.nav-item.active {
    background: linear-gradient(145deg, #3399FF, #1E90FF);
    color: #FFF;
    border-color: #3399FF;
    animation: pulse 2s infinite;
}

.nav-item a {
    text-decoration: none;
    color: inherit;
}

/* ===================== 컨텐츠 ===================== */
.content {
    flex: 1;
    background: #c1e7ffad;
    border: 2px solid #3399FF;
    border-radius: 15px;
    padding: 30px;
    position: relative;
    min-height: 75vh;
}

.content h2 {
    font-size: 24px;
    font-weight: 700;
    color: #004080;
    text-align: center;
    margin-bottom: 30px;
    padding: 15px;
    background: #E0F7FF;
    border: 2px solid #3399FF;
    border-radius: 20px;
    position: relative;
}

.content h2::before { 
    content:'☆'; 
    position:absolute; 
    left:20px; 
    color:#3399FF;
}

.content h2::after { 
    content:'☆'; 
    position:absolute; 
    right:20px; 
    color:#3399FF;
}

/* ===================== 버튼 ===================== */
.btn {
    display: inline-block;
    padding: 12px 24px;
    margin: 12px 5px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(145deg, #3399FF, #1E90FF);
    color: #fff;
    font-weight: 600;
    font-size: 16px;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
}

.btn:hover { 
    background: linear-gradient(145deg, #1E90FF, #3399FF); 
}

.btn:active {
    transform: translateY(0);
}

.btn-small { 
    padding: 6px 12px; 
    font-size: 12px; 
    margin: 5px 2px;
}

/* ===================== 주문 내역 ===================== */
.order-list {
    display: grid;
    gap: 15px;
    margin-top: 20px;
}

.order-item {
    background: #E0F7FF;
    border: 2px solid #3399FF;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 15px;
    transition: all 0.3s ease;
}

.order-item:hover {
    background: #cce7ff;
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(51,153,255,0.2);
}

.order-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

.post-title {
    font-size: 16px;
    font-weight: 600;
    color: #004080;
}

.order-date {
    font-size: 12px;
    color: #0066cc;
    font-weight: 500;
}

.order-details {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    margin-bottom: 15px;
}

.order-field {
    text-align: center;
}

.order-field label {
    display: block;
    font-size: 12px;
    margin-bottom: 5px;
    color: #004080;
    font-weight: 500;
}

.order-field span {
    font-weight: 600;
    color: #003366;
}

.status-badge {
    padding: 4px 8px;
    font-size: 11px;
    font-weight: 600;
    background: linear-gradient(145deg, #3399FF, #1E90FF);
    color: white;
    border-radius: 8px;
}

.order-actions {
    text-align: right;
}

.order-actions .btn {
    margin-left: 5px;
}

/* ===================== 상세 페이지 ===================== */
.detail-section {
    background: #E0F7FF;
    border: 2px solid #3399FF;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
}

.detail-section h3 {
    font-size: 18px;
    font-weight: 600;
    color: #004080;
    margin-bottom: 15px;
    padding-bottom: 8px;
    border-bottom: 1px solid #3399FF;
}

.detail-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.detail-item {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
}

.detail-item label {
    font-weight: 500;
    color: #004080;
}

.detail-item span {
    color: #003366;
    font-weight: 500;
}

/* 배송 추적 */
.tracking-step {
    background: rgba(255,255,255,0.7);
    border: 1px solid #3399FF;
    padding: 15px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-radius: 8px;
}

.tracking-status {
    font-weight: 600;
    color: #004080;
}

.tracking-date {
    font-size: 12px;
    color: #0066cc;
}

/* 섹션 관리 */
.section {
    display: none;
}

.section.active {
    display: block;
}

.back-button {
    margin-bottom: 20px;
}

/* 반응형 처리 */
@media (max-width: 768px) {
    .main-layout {
        flex-direction: column;
        gap: 15px;
    }
    
    .navigation {
        width: 100%;
    }
    
    .order-details {
        grid-template-columns: repeat(2, 1fr);
    }
    
    .detail-grid {
        grid-template-columns: 1fr;
    }
    
    .order-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 5px;
    }
}
</style>
</head>
<body>


    <div class="container">
        <div class="header">
            <h1>마이페이지</h1>
        </div>
        <div class="main-layout">

            <div class="sidebar">
                    <!-- 프로필 카드 -->
                    <div class="profile-card">
                        <div class="profile-pic">
                            <img src="school.png" alt="프로필사진">
                        </div>
                        <div class="profile-info">

                        </div>
                    </div>

                    <!-- 네비게이션 -->
                    <div class="navigation">
                        <a href="mymember.html"><div class="nav-item">♪ 회원정보</div></a>
                        <a href="#"><div class="nav-item active">♬ 가입 동아리</div></a>

        <div class="content">

                            <div class="order-field">

                            <div class="order-field">

                    <div class="order-item">

            <!-- 주문 상세 페이지 -->
            <div id="order-detail" class="section">

    <script>
        function showSection(sectionName) {
            // 모든 섹션 숨기기
            const sections = document.querySelectorAll('.section');
            sections.forEach(section => section.classList.remove('active'));
            
            // 선택된 섹션 보이기
            document.getElementById(sectionName).classList.add('active');
        }
        
        function showOrdersList() {
            showSection('orders-list');
        }
        
        function showOrderDetail(orderNum) {
            // 주문 상세 정보 데이터
            const orderData = {
                'ORD-2025-001': {
                    orderNum: 'ORD-2025-001',
                    orderDate: '2025-08-25',
                    productName: '포토카드 세트',
                    quantity: '2개',
                    unitPrice: '12,500원',
                    totalPrice: '25,000원',
                    deliveryFee: '3,000원',
                    finalAmount: '28,000원',
                    paymentMethod: '신용카드',
                    deliveryAddress: '서울시 강남구 역삼동 123-45',
                    recipient: '홍길동',
                    phone: '010-1234-5678',
                    status: '배송완료'
                },
                'ORD-2025-002': {
                    orderNum: 'ORD-2025-002',
                    orderDate: '2025-08-28',
                    productName: '공식 티셔츠',
                    quantity: '1개',
                    unitPrice: '45,000원',
                    totalPrice: '45,000원',
                    deliveryFee: '3,000원',
                    finalAmount: '48,000원',
                    paymentMethod: '카카오페이',
                    deliveryAddress: '서울시 강남구 역삼동 123-45',
                    recipient: '홍길동',
                    phone: '010-1234-5678',
                    status: '배송중'
                },
                'ORD-2025-003': {
                    orderNum: 'ORD-2025-003',
                    orderDate: '2025-08-30',
                    productName: '응원봉',
                    quantity: '1개',
                    unitPrice: '35,000원',
                    totalPrice: '35,000원',
                    deliveryFee: '3,000원',
                    finalAmount: '38,000원',
                    paymentMethod: '계좌이체',
                    deliveryAddress: '서울시 강남구 역삼동 123-45',
                    recipient: '홍길동',
                    phone: '010-1234-5678',
                    status: '결제완료'
                }
            };
            
            const order = orderData[orderNum];
            const detailContent = `
                <div class="detail-section">
                    <h3>주문 정보</h3>
                    <div class="detail-grid">
                        <div class="detail-item">
                            <label>주문번호:</label>
                            <span>${order.orderNum}</span>
                        </div>
                        <div class="detail-item">
                            <label>주문일자:</label>
                            <span>${order.orderDate}</span>
                        </div>
                        <div class="detail-item">
                            <label>주문상태:</label>
                            <span class="status-badge">${order.status}</span>
                        </div>
                    </div>
                </div>
                
                <div class="detail-section">
                    <h3>상품 정보</h3>
                    <div class="detail-grid">
                        <div class="detail-item">
                            <label>상품명:</label>
                            <span>${order.productName}</span>
                        </div>
                        <div class="detail-item">
                            <label>수량:</label>
                            <span>${order.quantity}</span>
                        </div>
                        <div class="detail-item">
                            <label>단가:</label>
                            <span>${order.unitPrice}</span>
                        </div>
                        <div class="detail-item">
                            <label>상품금액:</label>
                            <span>${order.totalPrice}</span>
                        </div>
                    </div>
                </div>
                
                <div class="detail-section">
                    <h3>결제 정보</h3>
                    <div class="detail-grid">
                        <div class="detail-item">
                            <label>상품금액:</label>
                            <span>${order.totalPrice}</span>
                        </div>
                        <div class="detail-item">
                            <label>배송비:</label>
                            <span>${order.deliveryFee}</span>
                        </div>
                        <div class="detail-item">
                            <label>총 결제금액:</label>
                            <span style="font-weight: bold;">${order.finalAmount}</span>
                        </div>
                        <div class="detail-item">
                            <label>결제방법:</label>
                            <span>${order.paymentMethod}</span>
                        </div>
                    </div>
                </div>
                
                <div class="detail-section">
                    <h3>배송 정보</h3>
                    <div class="detail-grid">
                        <div class="detail-item">
                            <label>수령인:</label>
                            <span>${order.recipient}</span>
                        </div>
                        <div class="detail-item">
                            <label>연락처:</label>
                            <span>${order.phone}</span>
                        </div>
                        <div class="detail-item" style="grid-column: 1 / -1;">
                            <label>배송주소:</label>
                            <span>${order.deliveryAddress}</span>
                        </div>
                    </div>
                </div>
            `;
            
            document.getElementById('order-detail-content').innerHTML = detailContent;
            showSection('order-detail');
        }
        
        function showDeliveryTracking(orderNum) {
            // 배송 조회 정보 데이터
            const trackingData = {
                'ORD-2025-001': {
                    orderNum: 'ORD-2025-001',
                    trackingNum: '1234567890123',
                    carrier: '대한통운',
                    status: '배송완료',
                    steps: [
                        { status: '주문접수', date: '2025-08-25 14:30', location: '온라인쇼핑몰' },
                        { status: '상품준비중', date: '2025-08-25 16:20', location: '물류센터' },
