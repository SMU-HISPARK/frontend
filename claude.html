<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/mypage.css">
    <title>회원정보</title>
    <style>

        .profile-details {
            display: flex;
            flex-direction: column;
            align-items: center; 
            gap: 10px;
            margin: 0 auto;
        }

        .form-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group label {
            width: 102px;
            text-align: left;
        }

        .form-group input {
            padding: 10px;
            border: 1px solid #ddd;
            font-size: 15px;
        }

        .form-group input[type="text"].tel {
            width: 150px; 
        }

        .form-group input:not(.tel) {
            width: 501.5px; 
        }

        /*.form-group input:focus {
            outline: none;
            border-color: #035fe0;
            background-color: #fff;
        }*/

        /* 버튼 */
        .btn {
            border: 1px solid #ccc;
            padding: 10px 20px;
            margin : 20px 10px -10px 0;
            cursor: pointer;
            font-size: 15px;
            font-weight: 400;
        }

        .upBtn{
            background : #1a1a1a;
            color : #FAFAFA;
        }

        .pwBtn{
            background : #FFF;
            color : #1a1a1a;
        }

        .form-group div {
            display: flex;
            justify-content: flex-start;
            margin-top: 10px;
        }

    </style>

    <script>
    fetch('header.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('header-container').innerHTML = data;
        });

    fetch('footer.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('footer-container').innerHTML = data;
        });
    </script>
</head>
<body>
    
    <div id="header-container">
        
    </div>
    <div id = "blank">

    </div>
    <div class="container">
        <div class="header">
            <div class = "title">마이페이지</div>
        </div>
        <ul class="menu">
            <li  class = "selected">
            <a href = "mypage_member.html">회원정보</a>
            </li>
            <li>
                <a href = "mypage_club.html">가입 동아리</a>
            </li>
            <li>
                <a href = "mypage_community.html">게시글 관리</a>
            </li>
            <li>
                <a href = "mypage_shop.html">주문내역</a>                
            </li>
        </ul>
        
        <div class="content">
            <div class="profile-details">
                <div class="form-group">
                    <label>아이디</label>
                    <input type="text" value="aaa" readonly>
                </div>
                <div class="form-group">
                    <label>이름</label>
                    <input type="text" value="홍길동" readonly>
                </div>
                <div class="form-group">
                    <label>닉네임</label>
                    <input type="text" value="길동스">
                </div>
                <div class="form-group">
                    <label>전화번호</label>
                    <input type="text" class = "tel" value="010">
                    <a>-</a>
                    <input type="text" class = "tel" value="1234">
                    <a>-</a>
                    <input type="text" class = "tel" value="5678">
                </div>
                <div class="form-group">
                    <label>이메일</label>
                    <input type="email" value="hong@example.com" readonly>
                </div>
                <div class="form-group">
                    <label>가입일</label>
                    <input type="text" value="2024-01-15" readonly>
                </div>
                <div class="form-group">
                    <label></label>
                    <div>
                        <button class="btn upBtn" id="editBtn">정보 수정</button>
                        <button class="btn pwBtn" onclick="location.href='mypw.html'">비밀번호 변경</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
            
    </div>

    <div id="footer-container">
        
    </div>
    <script>

        
        // 메뉴 클릭 처리
        document.addEventListener('DOMContentLoaded', function() {
            const menuItems = document.querySelectorAll('.menu li');
            
            menuItems.forEach(item => {
                item.addEventListener('click', function(e) {
                    // 모든 메뉴에서 selected 클래스 제거
                    menuItems.forEach(menu => {
                        menu.classList.remove('selected');
                    });
                    
                    // 클릭된 메뉴에 selected 클래스 추가
                    this.classList.add('selected');
                });
            });
        });

        // 정보 수정 기능
        document.addEventListener('DOMContentLoaded', function() {
            const editButton = document.getElementById('editBtn');
            editButton.addEventListener('click', function() {
                const inputs = document.querySelectorAll('.profile-details input:not([readonly])');
                
                if (this.textContent === '정보 수정') {
                    inputs.forEach(input => {
                        input.removeAttribute('readonly');
                        input.style.backgroundColor = '#fff';
                    });
                    this.textContent = '저장';
                } else {
                    inputs.forEach(input => {
                        input.setAttribute('readonly', true);
                        input.style.backgroundColor = '#f9f9f9';
                    });
                    this.textContent = '정보 수정';
                    alert('정보가 수정되었습니다.');
                }
            });
        });
    </script>
</body>
</html>
