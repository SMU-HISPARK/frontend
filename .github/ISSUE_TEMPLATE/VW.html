<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HISPARK VOTE WRITE</title>
    <style>
        /* Pretendard 폰트 불러오기 */
        @font-face {font-family: 'Pretendard'; src: url('https://cdn.jsdelivr.net/gh/Project-Noonnu/noonfonts_2107@1.1/Pretendard-Thin.woff') format('woff'); font-weight: 100; font-display: swap; }
        @font-face {font-family: 'Pretendard'; src: url('https://cdn.jsdelivr.net/gh/Project-Noonnu/noonfonts_2107@1.1/Pretendard-ExtraLight.woff') format('woff'); font-weight: 200; font-display: swap;}
        @font-face {font-family: 'Pretendard'; src: url('https://cdn.jsdelivr.net/gh/Project-Noonnu/noonfonts_2107@1.1/Pretendard-Light.woff') format('woff'); font-weight: 300; font-display: swap;}
        @font-face {font-family: 'Pretendard'; src: url('https://cdn.jsdelivr.net/gh/Project-Noonnu/noonfonts_2107@1.1/Pretendard-Regular.woff') format('woff'); font-weight: 400; font-display: swap;}
        @font-face {font-family: 'Pretendard'; src: url('https://cdn.jsdelivr.net/gh/Project-Noonnu/noonfonts_2107@1.1/Pretendard-Medium.woff') format('woff'); font-weight: 500; font-display: swap;}
        @font-face {font-family: 'Pretendard'; src: url('https://cdn.jsdelivr.net/gh/Project-Noonnu/noonfonts_2107@1.1/Pretendard-SemiBold.woff') format('woff'); font-weight: 600; font-display: swap;}
        @font-face {font-family: 'Pretendard'; src: url('https://cdn.jsdelivr.net/gh/Project-Noonnu/noonfonts_2107@1.1/Pretendard-Bold.woff') format('woff'); font-weight: 700; font-display: swap;}
        @font-face {font-family: 'Pretendard'; src: url('https://cdn.jsdelivr.net/gh/Project-Noonnu/noonfonts_2107@1.1/Pretendard-ExtraBold.woff') format('woff'); font-weight: 800; font-display: swap;}
        @font-face {font-family: 'Pretendard'; src: url('https://cdn.jsdelivr.net/gh/Project-Noonnu/noonfonts_2107@1.1/Pretendard-Black.woff') format('woff'); font-weight: 900; font-display: swap;}

        /* 기본 스타일 */
        body { font-family: 'Pretendard', sans-serif; margin: 0 auto; padding: 0; background-color: #ffffff; }
        .board-container { max-width: 1230px; margin: 40px auto; padding: 20px; background-color: #fff; }
        .board-title { text-align: center; font-size: 32px; color: #2c3e50; padding-bottom: 20px; border-bottom: 1px solid #2c3e50; margin-bottom: 20px;}
        
        /* 상단 경로 (Breadcrumb) 스타일*/
        .breadcrumb-container { max-width: 1230px; margin: 20px auto 0; padding: 0 20px; text-align: right; font-size: 14.4px; color: #7f8c8d; }
        .breadcrumb-container a { text-decoration: none; color: #7f8c8d; }
        .breadcrumb-container a:hover { text-decoration: underline; }
        .breadcrumb-container span.current { font-weight: bold; color: #333; }

        /* 글쓰기 폼 스타일*/
        .write-form { display: flex; flex-direction: column; gap: 15px; }
        .write-form .form-group { display: flex; flex-direction: column; }
        .write-form label { font-weight: bold; color: #333; margin-bottom: 5px; }
        .write-form input[type="text"], .write-form textarea, .write-form input[type="datetime-local"] {padding: 10px; border: 1px solid #ddd; 
                                                                                                        border-radius: 4px; font-size: 1em;outline: none; }
        .write-form textarea { min-height: 300px; resize: vertical; } /* 높이 수정 */
        .write-form .file-group { display: flex; align-items: center; gap: 10px; }
        .write-form .file-group input[type="file"] { border: none; padding: 0;}
        
        /* 투표 항목 추가 스타일 */
        .vote-options-container { margin-top: 20px; }
        .vote-options-container .vote-option { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .vote-options-container .vote-option input { flex-grow: 1; }
        .vote-options-container .remove-option-btn { 
            background-color: #e74c3c; 
            color: #fff; 
            border: none; 
            padding: 8px; 
            border-radius: 4px; 
            cursor: pointer;
        }
        .add-option-btn {
            background-color: #3498db; 
            color: #fff; 
            border: none; 
            padding: 10px 15px; 
            border-radius: 4px; 
            cursor: pointer;
            margin-top: 10px;
        }

        /* 버튼 그룹 스타일 */
        .button-group { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .button-group button { padding: 10px 20px; font-size: 1em; border: 1px solid #ddd; border-radius: 4px; cursor: pointer; }
        .button-group .save-button { background-color: #2c3e50; color: #fff; border-color: #2c3e50; }
        
        .button-group .cancel-button { background-color: #f1f1f1; color: #333; }
        
    </style>
</head>
<body>
    <div style="width:100%; height:150px; margin-bottom:20px; position: relative; background-color:#035fe0;">
        <a style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size:30px; color:white; font-weight:700;">header</a>
    </div>

    <div class="breadcrumb-container">
        <a href="#">홈</a> / <a href="#">게시판</a> / <a href="#"><span class="current">투표게시판</span></a>
    </div>

    <div class="board-container">
        <h2 class="board-title">VOTE</h2>
        
        <form class="write-form">
            <div class="form-group">
                <label for="post-title">제목</label>
                <input type="text" id="post-title" name="post-title" placeholder="제목을 입력하세요" required>
            </div>
            
            <div class="form-group">
                <label for="post-content">내용</label>
                <textarea id="post-content" name="post-content" placeholder="내용을 입력하세요" required></textarea>
            </div>

            <div class="form-group">
                <label for="end-date">투표 종료일 및 시간</label>
                <input type="datetime-local" id="end-date" name="end-date" required>
            </div>
            
            <div class="vote-options-container">
                <label>투표 항목</label>
                <div id="vote-options">
                    <div class="vote-option">
                        <input type="text" placeholder="투표 항목을 입력하세요" required>
                        <button type="button" class="remove-option-btn">삭제</button>
                    </div>
                    <div class="vote-option">
                        <input type="text" placeholder="투표 항목을 입력하세요" required>
                        <button type="button" class="remove-option-btn">삭제</button>
                    </div>
                </div>
                <button type="button" class="add-option-btn">투표 항목 추가하기</button>
            </div>
            
            <div class="form-group">
                <label for="post-file">파일 첨부</label>
                <input type="file" id="post-file" name="post-file">
            </div>

            <div class="button-group">
                <button type="submit" class="save-button">저장</button>
                <button type="button" class="cancel-button">취소</button>
            </div>
        </form>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const addOptionBtn = document.querySelector('.add-option-btn');
            const voteOptionsContainer = document.getElementById('vote-options');

            // 투표 항목 추가 버튼 클릭 이벤트
            addOptionBtn.addEventListener('click', () => {
                const newOptionDiv = document.createElement('div');
                newOptionDiv.classList.add('vote-option');
                newOptionDiv.innerHTML = `
                    <input type="text" placeholder="투표 항목을 입력하세요" required>
                    <button type="button" class="remove-option-btn">삭제</button>
                `;
                voteOptionsContainer.appendChild(newOptionDiv);
            });

            // 투표 항목 삭제 버튼 클릭 이벤트
            voteOptionsContainer.addEventListener('click', (e) => {
                if (e.target.classList.contains('remove-option-btn')) {
                    // 최소 2개의 항목은 유지
                    if (voteOptionsContainer.children.length > 2) {
                        e.target.closest('.vote-option').remove();
                    } else {
                        alert('최소 2개의 투표 항목이 필요합니다.');
                    }
                }
            });
        });
    </script>
</body>
</html>
