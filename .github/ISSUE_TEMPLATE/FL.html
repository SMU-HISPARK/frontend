        /* 기본 스타일 초기화 */
        body { font-family: 'Pretendard', sans-serif; margin: 0 auto; padding: 0; background-color: #ffffff; }
        .board-container { max-width: 1230px; margin: 40px auto; padding: 20px; background-color: #fff; }
        .board-title { text-align: center; font-size: 32px; color: #2c3e50; padding-bottom: 20px; }
        
        /* 상단 경로 (Breadcrumb) 스타일 */
        .breadcrumb-container { max-width: 1230px; margin: 0 auto; padding: 0 20px; text-align: right; font-size: 14.4px; color: #7f8c8d; }
        .breadcrumb-container a { text-decoration: none; color: #7f8c8d; }
        .breadcrumb-container span.current { font-weight: bold; color: #333; }

        /* 게시글 목록 (Table) 스타일 */
        .post-table { width: 100%; border-collapse: collapse; }
        .post-table th, .post-table td { padding: 15px 0; border-bottom: 1px solid #eee; text-align: center; line-height:22px;}
        .post-table th { height:29.5px;  }
        .post-table td {color: #636363; height:50px;}
        
        .post-table thead { background-color: #f1f3f5; font-weight:700;font-size:18px;}
        .post-table tbody { font-size: 16px;}

        .post-table td:nth-child(2) { text-align: left; padding-left:15px; font-weight: 400;}

        .post-table .post-title a { text-decoration: none; color: #1a1a1a;}
        
        /* 댓글 수 스타일 */
        .c-count { font-size: 13px; color:#035fe0; vertical-align: middle; margin-left: 5px; }

        /* 검색창 스타일 */
        .search-container { display: flex; align-items: center; gap: 8px; margin-top: 30px; justify-content: flex-start;}
        .search-container select, .search-container input {height:45px; padding-left:15px; border: 1px solid #ccc; font-size: 15px; }
        .search-container input{box-sizing: border-box;}
        .search-container button {background-color:white; height:45px; width:66px; line-height: 45px; font-size: 13px; font-weight:500; color:#1a1a1a;border: 1px solid #ccc; }
        
        /* 글쓰기 버튼 */
        .write-button {background-color: white;height: 45px;width: 80px;line-height: 45px;font-size: 13px;font-weight: 500;color: #1a1a1a;border: 1px solid #ccc;text-align: center;
		    text-decoration: none; display: flex;justify-content: center;align-items: center;
		}
        
        /*-------------------------------------------------- 페이지네이터---------------------------------------------------- */
        .pg-container {display: flex;justify-content: center;margin: 50px 0 20px 0;width: 100%;}
		.paginator {display: inline-flex;align-items: center;line-height: 1;}
		/* 버튼 그룹 */
		.pg-btns {display: inline-flex; margin: 0 10px;}
		.pg-btns button {border: none;margin: 0;padding: 12px 0;width: 24px;background: transparent;color: #ccc;cursor: pointer;font-size: 30px;line-height: 0;}
		.pg-btns button:disabled {cursor: default;}
		.pg-btns button {color: #ccc;}
		/* 페이지 번호 */
		.pg-numbers {display: inline-block; margin: 0 10px;}
		.pg-numbers a { margin: 0 5px; color: #ccc;font-size: 20px;cursor: pointer;text-decoration: none;}
		.pg-numbers a.active {color: #1a1a1a;}
		/* SVG 아이콘 */
		.pg-btns svg {width: 16px;height: 16px;fill: currentColor;}
		
    </style>
</head>
