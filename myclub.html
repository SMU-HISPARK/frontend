<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/mypage.css">
    <title>♡ 홍길동님의 미니홈피 ♡ - 가입 동아리</title>
    <style>
        /* 동아리 카드 */
        .club-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .club-card {
            border: 2px solid #3399FF;
            background: #E0F7FF;
            padding: 20px;
            text-align: center;
            border-radius: 15px;
            transition: all 0.3s ease;
            position: relative;
            cursor: pointer;
        }

        .club-card:hover {
            background: #66B2FF;
            color: #fff;
        }

        .club-card.inactive {
            border: 2px dashed #3399FF;
            color: #999;
            background: #e5e7ebb9;
            cursor: default;
        }

        .club-emoji img {
            width: 60px;
            height: 60px;
            margin-bottom: 10px;
        }

        .club-name {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 5px;
        }

        .join-date {
            font-size: 12px;
            color: #003366;
        }

        .club-card:hover .join-date {
            color: #fff;
        }

        .club-card.inactive .join-date {
            color: #999;
        }

        /* 버튼 스타일 */
        .btn {
            padding: 12px 24px;
            margin: 12px 5px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(145deg, #3399FF, #1E90FF);
            color: #fff;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: linear-gradient(145deg, #1E90FF, #3399FF);
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }

        /* 버튼 컨테이너 */
        .button-container {
            text-align: center;
            margin-top: 30px;
            padding-bottom: 30px;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(51, 153, 255, 0.7);
            }
            70% {
                box-shadow: 0 0 0 10px rgba(51, 153, 255, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(51, 153, 255, 0);
            }
        }

    </style>
</head>
<body>
    <div class="wrap">
        <div id="header">
            <div id="snbBox">
                <div id="snb">
                    <a href="#"><img src="/images/home.png"></a>
                </div>
            </div>
        </div>

        <div class="container">
            <div class="main-layout">
                <div class="sidebar">
                    <!-- 프로필 카드 -->
                    <div class="profile-card">
                        <div class="profile-pic">
                            <img src="/images/school.png" alt="프로필사진">
                        </div>
                        <div class="profile-info">
                            <div class="profile-name">♡ 홍길동 ♡</div>
                        </div>
                    </div>

                    <!-- 네비게이션 -->
                    <div class="navigation">
                        <a href="mymember.html"><div class="nav-item">♪ 회원정보</div></a>
                        <a href="#"><div class="nav-item active">♬ 가입 동아리</div></a>
                        <a href="mycommu.html"><div class="nav-item">♫ 게시글 관리</div></a>
                        <a href="myshop.html"><div class="nav-item">♩ 주문내역</div></a>
                    </div>
                </div>

                <!-- 메인 컨텐츠 -->
                <div class="content">
                    <h2>가입 동아리</h2>
                    
                    <div class="club-grid">
                        <div class="club-card" onclick="viewClubEpisode('제과제빵부')">
                            <div class="club-emoji"><img src="/images/cake.png" alt="제과제빵부"></div>
                            <div class="club-name">제과제빵부</div>
                            <div class="join-date">가입일: 2025-08-30</div>
                        </div>
                        
                        <div class="club-card" onclick="viewClubEpisode('밴드부')">
                            <div class="club-emoji"><img src="/images/band.png" alt="밴드부"></div>
                            <div class="club-name">밴드부</div>
                            <div class="join-date">가입일: 2025-08-25</div>
                        </div>
                        
                        <div class="club-card" onclick="viewClubEpisode('도서부')">
                            <div class="club-emoji"><img src="/images/book.png" alt="도서부"></div>
                            <div class="club-name">도서부</div>
                            <div class="join-date">가입일: 2025-08-20</div>
                        </div>
                        
                        <div class="club-card inactive">
                            <div class="club-emoji"><img src="/images/basket.png" alt="운동부"></div>
                            <div class="club-name">운동부</div>
                            <div class="join-date">미가입</div>
                        </div>
                        
                        <div class="club-card inactive">
                            <div class="club-emoji"><img src="/images/school.png" alt="선도부"></div>
                            <div class="club-name">선도부</div>
                            <div class="join-date">미가입</div>
                        </div>
                    </div>
                
                    
                    <div class="button-container">
                        <button class="btn" onclick="startNewTest()">새 테스트 시작하기</button>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script>
        function viewClubEpisode(clubName) {
            alert(`${clubName} 에피소드 보기`);
            // 여기에 에피소드 보기 로직을 구현할 수 있습니다.
        }
        
        function startNewTest() {
            // 여기에 테스트 페이지로 이동하는 로직을 구현할 수 있습니다.
        }
    </script>
</body>
</html>
