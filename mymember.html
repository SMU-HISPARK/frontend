<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/mypage.css">
    <title>마이페이지 - 회원정보</title>
    <style>
        .smile {
            text-align: right;
            margin-bottom : 5px;
        }


        /* 1. label 스타일 */
        .profile-details label {
            display: inline-block;
            text-align: center;
            padding-left : 25px;
            margin-right : 3px;
            width: 95px;   
            font-weight: 600;
            color: #004080;
            font-size: 16px;       
            margin-bottom: 12px;  
        }

        /* 2. input 스타일 */
        .profile-details input {
            width: calc(100% - 130px); 
            padding: 12px 16px;       
            margin-bottom : 20px;
            border: 1px solid #3399FF;
            border-radius: 10px;       
            background: #E0F7FF;
            outline: none;
            font-size: 16px;           
            color: #003366;
            margin-bottom: 16px;      
        }

        .profile-details input:focus {
            border-color: #1E90FF;
        }

        /* 버튼 스타일 */
        .btn {
            padding: 12px 24px;    
            margin : 12px 5px;    
            border: none;
            border-radius: 12px;
            background: linear-gradient(145deg, #3399FF, #1E90FF);
            color: #fff;
            font-weight: 600;
            font-size: 16px;         
            cursor: pointer;
        }
        

    </style>
</head>
<body>
    <div class="wrap">
        <div id="header">
            <div id="snbBox">
                <div id="snb">
                        <a href="#"><img src = "/images/home.png"></a>
                </div>
            </div>
        </div>

        <div class="container">
            <div class="main-layout">
                <div class="sidebar">
                    <!-- 프로필 카드 -->
                    <div class="profile-card">
                        <div class="profile-pic">
                            <img src="/images/school.png" alt="프로필사진">
                        </div>
                        <div class="profile-info">
                            <div class="profile-name">♡ 홍길동 ♡</div>
                        </div>
                    </div>

                    <!-- 네비게이션 -->
                    <div class="navigation">
                        <a href="#"><div class="nav-item active">♪ 회원정보</div></a>
                        <a href="myclub.html"><div class="nav-item">♬ 가입 동아리</div></a>
                        <a href="mycommu.html"><div class="nav-item">♫ 게시글 관리</div></a>
                        <a href="myshop.html"><div class="nav-item">♩ 주문내역</div></a>
                    </div>
                </div>

                <!-- 메인 컨텐츠 -->
                <div class="content">
                    <h2>회원정보</h2>
                    <div class="profile-details">
                        <div class="form-group">
                            <label>아이디</label>
                            <input type="text" value="aaa" readonly>
                        </div>
                        <div class="form-group">
                            <label>이름</label>
                            <input type="text" value="홍길동" readonly>
                        </div>
                        <div class="form-group">
                            <label>전화번호</label>
                            <input type="tel" value="010-1234-5678">
                        </div>
                        <div class="form-group">
                            <label>이메일</label>
                            <input type="email" value="hong@example.com" readonly>
                        </div>
                        <div class="form-group">
                            <label>가입일</label>
                            <input type="text" value="2024-01-15" readonly>
                        </div>
                        <div class="form-group">
                            <label></label>
                            <div>
                                <button class="btn" id="editBtn">정보 수정</button>
                                <button class="btn" onclick="location.href='mypw.html'">비밀번호 변경</button>
                            </div>
                        </div>
                    </div>
                    <div class = "smile"><img src = "/images/pixelart_blue.png"></div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
