<style>
     /*이름 폰트*/
        @import url('https://fonts.googleapis.com/css2?family=Vast+Shadow&display=swap');
        *{margin:0; padding: 0;
            font-optical-sizing: auto; font-style: normal;
            box-sizing: border-box;
        }
        tbody{
            width: 100%;
        }
        /*팀멤버 폰트*/
        @font-face {
            font-family: 'Cafe24Surround';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2105_2@1.0/Cafe24Ssurround.woff') format('woff');
            font-weight: normal;
            font-display: swap;
        }
        /* 아티스트 글씨체 */
        @font-face {
            font-family: 'SchoolSafetyKid';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2307-2@1.0/HakgyoansimGgooreogiR.woff2') format('woff2');
            font-weight: normal;
            font-display: swap;
        }

        /* 바디 스크롤 가능하게끔 */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: url('images/별작은버전.jpg') no-repeat center center / cover;
            z-index: -1; /* 뒤로 보내기 */
        }
        .background{
            padding-top: 68px;
        }
        
        /* 이름 예전 글씨체
        @font-face {
            font-family: 'SandollSamlipHobbangOutline';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts-20-12@1.0/SDSamliphopangche_Outline.woff') format('woff');
            font-weight: normal;
            font-display: swap;
        }*/
        
        .name{
            text-align: center;
        }
        .content {
            position: relative;
            z-index: 1;
            width: 60%; 
            height: 1452px;
            margin: 30px auto;
        /* background: white;*/
            min-height: 2000px;
        }
   
        .total {

        table {

        }

        }

           /* font-family: 'SandollSamlipHobbangOutline', sans-serif;
            font-weight: 400;*/
            font-family: "Vast Shadow", serif;
            font-weight: 500;
            font-style: normal;
        }
        .profile01 {
            display: flex;          /* 가로 정렬 */
            align-items: center;    /* 위아래 가운데 정렬 */
            padding: 30px 0px 30px 30px;
          /*  border-bottom: 1px solid gray;*/

            height: auto;
            width: 100%;
            border-collapse: collapse;
        }

        .profile_image img {
        width: 300px;
        margin-right: 30px;
        height: auto;
        /*border: 1px solid black;*/
        }
        .profile_info th{
            font-size: 20px;
            width: 25%;
        }
        .profile_info th,.profile_info td{
            text-align: center;
            border:  3px solid #dcedfd;;
            color: #1a1a1a ;
        }
        .profile_info td{
            font-size: 22px;

            width: 44.5%;
             font-family: 'SchoolSafetyKid', sans-serif;

        }
        .profile02{
            width: 100%;
            height: 200px;
        }

        .inform{
        
            align-items: center;    /* 위아래 가운데 정렬 */
            padding: 30px 0px 30px 30px;
          /*  border-bottom: 3px solid black;
            border-left: 3px solid black;
            border-right: 3px solid black;*/
            height: auto;
            width: 100%;        
            
        }
        .inform th,.inform td{
            text-align: center;
            width:50px;
            font-size: 25px;
            /*table-layout: fixed;*/
            color: #1a1a1a ;
        }
        .inform td{
            padding: 25px 0px;
            height: 250px;
        }
        .inform td img{
            border: 3px solid #dcedfd;
            border-radius: 7px;
            height: 100%;
            margin: 0px 5px;

        }
        .inform .photo{
            width: 70%;
            margin: 0 auto;
        }
        .photo{
            
            display: flex;
        }



        /* 연락처  css*/
        .phone_sticker {
            
            width: 200px;
            height: 250px;
            display: inline-block;
            background: #dcedfd; /* 종이 포스트잇 색상 */
            padding: 15px 25px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 50px;


        /* 종이 그림자 효과 */
            box-shadow: 4px 4px 6px rgba(0,0,0,0.25);

        /* 살짝 기울어진 듯한 효과 */
            transform: rotate(2deg);
            transition: transform 0.3s ease;
        }
        .phone_sticker p{
            text-align: center;
            margin-top: 50px;
            font-family: 'SchoolSafetyKid', sans-serif;
        }
        .phone_sticker:hover {
            transform: rotate(0deg) scale(1.05);
        }
        .phone_sticker:active {
            transform: scale(0.95) rotate(2deg);
        }



        /* 모달 배경 */
        .modal {
            display: none; 
            position: fixed;
            z-index: 1000;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.8);
            animation: fadeIn 0.3s ease;
        }

        /* 모달 이미지 */
        .modal-content {
            display: block;
            margin: 5% auto;
            max-width: 90%;
            max-height: 80%;
            border-radius: 10px;
            animation: zoomIn 0.3s ease;
        }

        /* 닫기 버튼 */
        .close {
            position: absolute;
            top: 20px; right: 40px;
            color: white;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }

        /* 페이드인 */
        @keyframes fadeIn {
            from { opacity: 0; } 
            to { opacity: 1; }
        }

        /* 이미지 줌인 */
        @keyframes zoomIn {
            from { transform: scale(0.7); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

    </style>
<script>
    document.addEventListener("DOMContentLoaded", function(){
        const modal = document.getElementById("imgModal");
        const modalImg = document.getElementById("modalImg");
        const closeBtn = document.querySelector(".close");

        document.querySelectorAll(".inform td.photo img").forEach(img => {
            img.addEventListener("click", function() {
                modal.style.display = "block";
                modalImg.src = this.src;
            });
        });

        closeBtn.addEventListener("click", function() {
            modal.style.display = "none";
        });

        modal.addEventListener("click", function(e) {
            if (e.target === modal) {
                modal.style.display = "none";
            }
        });
    });

</script>
<body>

</div>
